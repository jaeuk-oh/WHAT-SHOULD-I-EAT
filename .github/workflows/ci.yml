name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: 프로덕션 빌드
        run: npm run build

      # 과거에 ESM 확장자 누락으로 배포 직후 모든 API가 500이 난 적이 있다.
      # api/ 안의 상대 임포트에 .js가 빠지면 여기서 잡는다.
      - name: api/ ESM 임포트 확장자 검사
        run: |
          if grep -rnE "from '\./[A-Za-z_-]+'" api/; then
            echo "::error::api/ 의 상대 임포트에는 .js 확장자가 필요합니다 (Vercel Node ESM 런타임)."
            exit 1
          fi
          echo "OK"

  # 보안 규칙은 코드와 별도로 배포되는 산출물이라 타입체크·빌드로는 검증되지 않는다.
  # 규칙과 코드가 어긋나 알림 기능이 통째로 죽은 적이 있어 별도 잡으로 검증한다.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Firestore 에뮬레이터는 JVM 위에서 돈다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: 보안 규칙 테스트
        run: npm run test:rules
